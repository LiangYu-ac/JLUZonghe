name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-tests:
    name: Python Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Studio frontend
        working-directory: frontend
        run: npm ci && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,captcha]" pytest

      - name: Run pytest
        run: pytest -q

  android-tests:
    name: Android Robolectric Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Studio frontend
        working-directory: frontend
        run: npm ci && npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Android Robolectric unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PbuildPython="$(which python3)" \
            -Drobolectric.dependency.repo.url=https://repo1.maven.org/maven2 \
            -Drobolectric.dependency.repo.id=central \
            testDebugUnitTest
