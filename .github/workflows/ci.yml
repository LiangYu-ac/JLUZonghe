name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-tests:
    name: Python Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Studio frontend
        working-directory: frontend
        run: npm ci && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,captcha]" pytest

      - name: Run pytest
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: pytest -q

  android-tests:
    name: Android Robolectric Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Studio frontend
        working-directory: frontend
        run: npm ci && npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Android SDK 35 components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "$SDKMGR" --licenses >/dev/null
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run Android Robolectric unit tests
        working-directory: android
        env:
          PIP_INDEX_URL: https://pypi.org/simple
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PbuildPython="$(which python3)" \
            -Drobolectric.dependency.repo.url=https://repo1.maven.org/maven2 \
            -Drobolectric.dependency.repo.id=central \
            testDebugUnitTest
