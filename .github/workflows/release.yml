name: Multi-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,captcha]" pyinstaller pywebview
          cd frontend
          npm ci
          cd ..
          python packaging/build_exe.py
          $ver = python -c "import jlu_toolkit; print(jlu_toolkit.__version__)"
          $src = "dist/吉大综合.exe"
          $dst = "dist/吉大综合-$ver-windows-x64.exe"
          Copy-Item $src $dst -Force
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "$hash  吉大综合-$ver-windows-x64.exe" | Out-File -FilePath "$dst.sha256" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/吉大综合-*-windows-x64.exe
            dist/吉大综合-*-windows-x64.exe.sha256

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build macOS .app and .dmg
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[desktop,captcha]" pyinstaller pywebview
          (cd frontend && npm ci)
          python3 packaging/build_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/吉大综合-*-macos-*.dmg
            dist/吉大综合-*-macos-*.dmg.sha256

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35 components
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Build Android APK and run Robolectric tests
        env:
          PIP_INDEX_URL: https://pypi.org/simple
          ROBOLECTRIC_REPO_URL: https://repo1.maven.org/maven2
          ROBOLECTRIC_REPO_ID: central
        run: |
          chmod +x android/gradlew
          (cd frontend && npm ci)
          python3 packaging/build_android.py --with-tests
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            dist/吉大综合-*-android.apk
            dist/吉大综合-*-android.apk.sha256

  build-ios:
    name: Build iOS (.ipa unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build iOS unsigned IPA
        run: |
          (cd frontend && npm ci)
          python3 packaging/build_ios.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: |
            dist/吉大综合-*-ios-unsigned.ipa
            dist/吉大综合-*-ios-unsigned.ipa.sha256

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release and attach all installers
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
