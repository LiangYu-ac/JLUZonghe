name: Multi-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows executable
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,captcha]" pyinstaller pywebview
          cd frontend
          npm ci
          cd ..
          python packaging/build_exe.py
          $ver = python -c "import jlu_toolkit; print(jlu_toolkit.__version__)"
          $src = "dist/吉大综合.exe"
          $dst = "dist/JLUZonghe-$ver-windows-x64.exe"
          Copy-Item $src $dst -Force
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "$hash  JLUZonghe-$ver-windows-x64.exe" | Out-File -FilePath "$dst.sha256" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/JLUZonghe-*-windows-x64.exe
            dist/JLUZonghe-*-windows-x64.exe.sha256

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build macOS .app and .dmg
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[desktop,captcha]" pyinstaller pywebview
          (cd frontend && npm ci)
          python3 packaging/build_macos.py
          ver=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('jlu_toolkit/__init__.py', encoding='utf-8').read()).group(1))")
          arch="${{ matrix.arch }}"
          cp "dist/吉大综合-${ver}-macos-${arch}.dmg" "dist/JLUZonghe-${ver}-macos-${arch}.dmg"
          (cd dist && shasum -a 256 "JLUZonghe-${ver}-macos-${arch}.dmg" > "JLUZonghe-${ver}-macos-${arch}.dmg.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            dist/JLUZonghe-*-macos-*.dmg
            dist/JLUZonghe-*-macos-*.dmg.sha256

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Android SDK 35 components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "$SDKMGR" --licenses >/dev/null
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android APK and run Robolectric tests
        env:
          PIP_INDEX_URL: https://pypi.org/simple
          ROBOLECTRIC_REPO_URL: https://repo1.maven.org/maven2
          ROBOLECTRIC_REPO_ID: central
        run: |
          chmod +x android/gradlew
          (cd frontend && npm ci)
          python3 packaging/build_android.py --with-tests
          ver=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('jlu_toolkit/__init__.py', encoding='utf-8').read()).group(1))")
          cp "dist/吉大综合-${ver}-android.apk" "dist/JLUZonghe-${ver}-android.apk"
          (cd dist && sha256sum "JLUZonghe-${ver}-android.apk" > "JLUZonghe-${ver}-android.apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            dist/JLUZonghe-*-android.apk
            dist/JLUZonghe-*-android.apk.sha256

  build-ios:
    name: Build iOS (.ipa unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build iOS unsigned IPA
        run: |
          (cd frontend && npm ci)
          python3 packaging/build_ios.py
          ver=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('jlu_toolkit/__init__.py', encoding='utf-8').read()).group(1))")
          cp "dist/吉大综合-${ver}-ios-unsigned.ipa" "dist/JLUZonghe-${ver}-ios-unsigned.ipa"
          (cd dist && shasum -a 256 "JLUZonghe-${ver}-ios-unsigned.ipa" > "JLUZonghe-${ver}-ios-unsigned.ipa.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: |
            dist/JLUZonghe-*-ios-unsigned.ipa
            dist/JLUZonghe-*-ios-unsigned.ipa.sha256

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release and attach all installers
        uses: softprops/action-gh-release@v2
        with:
          name: 吉大综合 ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 吉大综合 ${{ github.ref_name }} 全平台安装包

            ### 桌面端 & 移动端下载说明
            - **Windows (x64)**：`JLUZonghe-*-windows-x64.exe`（双击即用）
            - **macOS Apple Silicon (M 系列)**：`JLUZonghe-*-macos-arm64.dmg`
            - **macOS Intel**：`JLUZonghe-*-macos-x86_64.dmg`
              > 提示：macOS 初次打开未公证的 `.app` 若提示无法验证或已损坏，请在终端执行 `xattr -cr /Applications/吉大综合.app` 后再打开。
            - **Android (7.0+ / API 24+)**：`JLUZonghe-*-android.apk`（`arm64-v8a` / `x86_64` 通用）
            - **iOS (15.0+ 未签名侧载包)**：`JLUZonghe-*-ios-unsigned.ipa`
              > 提示：可通过 AltStore / SideStore / Sideloadly / TrollStore / Xcode 签名安装至 iPhone 或 iPad。

            ### 校验文件
            每个安装包均附带对应的 `.sha256` 校验文件，可用于核对下载完整性。
          files: artifacts/*
