plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "cn.superjlu.app"
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId "cn.superjlu.app"
        minSdk 24
        targetSdk 35
        versionCode((System.getenv("JLU_VERSION_CODE") ?: "10000") as int)
        versionName(System.getenv("JLU_VERSION_NAME") ?: "1.3.4")
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs += [
                "--add-opens=java.base/java.lang=ALL-UNNAMED",
                "--add-opens=java.base/java.util=ALL-UNNAMED",
                "--add-opens=java.base/java.io=ALL-UNNAMED",
                "--add-opens=java.base/java.net=ALL-UNNAMED",
                "--add-opens=java.base/java.security=ALL-UNNAMED",
                "--add-opens=java.base/java.text=ALL-UNNAMED",
                "--add-opens=java.base/jdk.internal.access=ALL-UNNAMED",
                "--add-opens=java.desktop/java.awt.font=ALL-UNNAMED",
                "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED"
            ]
            systemProperty "robolectric.dependency.repo.url", System.getProperty("robolectric.dependency.repo.url", "https://maven.aliyun.com/repository/public")
            systemProperty "robolectric.dependency.repo.id", System.getProperty("robolectric.dependency.repo.id", "aliyun")
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.17"
}

chaquopy {
    defaultConfig {
        version "3.13"
        // 构建机上需要同版本的 Python（python3.13）；可用 -PbuildPython=/path/python3.13 覆盖
        if (project.hasProperty("buildPython")) buildPython(project.property("buildPython"))
        extractPackages "studio_web"
        pip {
            install "cryptography==42.0.8"
            // 图形验证码自动识别（captcha_solver）需要 Pillow；Chaquopy 提供 cp313 arm64/x86_64 轮子
            install "pillow==11.0.0"
            // 成绩文件导入：纯 Python 读取器，不引入 pandas / NumPy 原生依赖。
            install "openpyxl>=3.1,<4"
            install "xlrd>=2.0,<3"
            // keyring 在 Android 上没有可用后端，暂不安装，走 secure_store 的文件回退
        }
    }
    sourceSets {
        main {
            // 直接打包仓库根目录下的 jlu_toolkit 包（不复制，桌面端代码保持唯一来源）
            srcDir "../.."
            srcDir "src/main/python"
            srcDir "${layout.buildDirectory.get().asFile}/generated/studio_python"
            include "jlu_toolkit/**", "jlu_android.py", "studio_web/**"
            exclude "**/__pycache__/**"
        }
    }
}

def syncStudioFrontend = tasks.register("syncStudioFrontend") {
    def srcDist = file("../../frontend/dist")
    def outRoot = file("${layout.buildDirectory.get().asFile}/generated/studio_python")
    inputs.dir(srcDist)
    outputs.dir(outRoot)
    doFirst {
        if (!new File(srcDist, "index.html").isFile()) {
            throw new GradleException("frontend/dist/index.html missing. Run `cd frontend && npm run build` first.")
        }
    }
    doLast {
        def pkgDir = new File(outRoot, "studio_web")
        def distDir = new File(pkgDir, "dist")
        project.delete(pkgDir)
        distDir.mkdirs()
        new File(pkgDir, "__init__.py").write("", "UTF-8")
        project.copy {
            from srcDist
            into distDir
        }
    }
}

preBuild.dependsOn(syncStudioFrontend)
tasks.configureEach { t ->
    if (t.name.contains("Python") && t.name != "syncStudioFrontend") {
        t.dependsOn(syncStudioFrontend)
    }
}
